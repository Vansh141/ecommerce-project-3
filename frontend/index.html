<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <link rel="icon" type="image/jpeg" href="/logo.jpg" />
    <link rel="apple-touch-icon" href="/logo.jpg" />

    <title>TOUCHH — Ethnic wear for every moment</title>
    <meta
      name="description"
      content="Shop TOUCHH — timeless Indian ethnic wear, thoughtfully made for every occasion."
    />
    <meta name="theme-color" content="#1F1A17" />
    <meta name="robots" content="index,follow" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TOUCHH" />
    <meta property="og:title" content="TOUCHH — Ethnic wear for every moment" />
    <meta
      property="og:description"
      content="Timeless Indian ethnic wear, thoughtfully made for every occasion."
    />
    <!-- Open Graph requires an ABSOLUTE URL: Facebook, WhatsApp and X fetch the
         image server-side with no page context to resolve a relative path
         against, so "/logo.jpg" silently yields a link preview with no image.
         These must stay in step with the live storefront origin, https://touchh.in. -->
    <meta property="og:image" content="https://touchh.in/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Model in an ivory embroidered kurta and sequinned dupatta — TOUCHH ethnic wear" />
    <meta property="og:url" content="https://touchh.in/" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TOUCHH — Ethnic wear for every moment" />
    <meta
      name="twitter:description"
      content="Timeless Indian ethnic wear, thoughtfully made for every occasion."
    />
    <meta name="twitter:image" content="https://touchh.in/og-image.jpg" />

    <!-- Fonts are fetched from Google; preconnecting removes a round trip on
         first paint, which is the slowest moment on a mobile connection. The
         stylesheet is linked here rather than @imported from the bundle CSS, so
         it is requested with the page instead of after it. Only the weights
         the design uses: Jost 400/500, Playfair Display 400/500 + italic 400. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="padding: 2rem; font-family: sans-serif; text-align: center">
        This store needs JavaScript enabled to run. Please turn it on and reload.
      </div>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
