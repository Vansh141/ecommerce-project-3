<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <link rel="icon" type="image/jpeg" href="/logo.jpg" />
    <link rel="apple-touch-icon" href="/logo.jpg" />

    <title>TOUCH — Considered clothing, made in India</title>
    <meta
      name="description"
      content="TOUCH — linen, cotton and silk pieces designed in Mumbai and made in small runs. Shop dresses, tops, co-ords and accessories."
    />
    <meta name="theme-color" content="#1C1917" />
    <meta name="robots" content="index,follow" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TOUCH" />
    <meta property="og:title" content="TOUCH — Considered clothing, made in India" />
    <meta
      property="og:description"
      content="Linen, cotton and silk pieces designed in Mumbai and made in small runs."
    />
    <!-- Open Graph requires an ABSOLUTE URL: Facebook, WhatsApp and X fetch the
         image server-side with no page context to resolve a relative path
         against, so "/logo.jpg" silently yields a link preview with no image.
         Replace the origin below with the production domain before launch. -->
    <meta property="og:image" content="https://www.example.com/logo.jpg" />
    <meta property="og:url" content="https://www.example.com/" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TOUCH — Considered clothing" />
    <meta
      name="twitter:description"
      content="Linen, cotton and silk pieces designed in Mumbai and made in small runs."
    />
    <meta name="twitter:image" content="https://www.example.com/logo.jpg" />

    <!-- Fonts are fetched from Google; preconnecting removes a round trip on
         first paint, which is the slowest moment on a mobile connection. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="padding: 2rem; font-family: sans-serif; text-align: center">
        This store needs JavaScript enabled to run. Please turn it on and reload.
      </div>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
